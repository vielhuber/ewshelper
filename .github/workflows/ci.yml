name: CI

env:
    CI: true

on:
    workflow_dispatch:
    push:

jobs:
    build-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: curl
                  coverage: none

            - name: Composer
              run: composer install --no-interaction

            - name: PHPUnit
              run: ./vendor/bin/phpunit
